# Gruvbox Dark (medium) — minimal tmux theme, transparent status background
# bg0 #282828 | bg1 #3c3836 | bg2 #504945 | gray #928374 | fg #ebdbb2
# yellow #d79921 | bright yellow #fabd2f | bright red #fb4934 | bright orange #fe8019
# --- window -------------------------------------------------------------

# --- status bar ---------------------------------------------------------
set -g status on
set -g status-justify left
set -g status-style "bg=default,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 40

# left: session name; inverts to a filled yellow block while prefix (^A) is active
set -g status-left "#{?client_prefix,#[fg=#282828#,bg=#d79921#,bold] #S ,#[fg=#fabd2f#,bg=default#,bold] #S }#[default] "

# right: short hostname
set -g status-right "#[fg=#928374,bg=default] #h "

# windows: index:name, zoom glyph only (no default * - flags)
set -g window-status-separator " "
set -g window-status-format         "#[fg=#928374,bg=default] #I:#W#{?window_zoomed_flag, 󰍉,} "
set -g window-status-current-format "#[fg=#fabd2f,bg=default,bold] #I:#W#{?window_zoomed_flag,#[fg=#928374#,nobold] 󰍉,} "
set -g window-status-activity-style "fg=#fe8019,bg=default"
set -g window-status-bell-style     "fg=#fb4934,bg=default,bold"

# --- panes ---------------------------------------------------------------
set -g pane-border-style        "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"

# --- messages / command prompt / copy mode / clock -----------------------
set -g message-style         "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#fabd2f"
set -g mode-style            "bg=#d79921,fg=#282828"
set -g clock-mode-colour     "#fabd2f"
set -g clock-mode-style      24

# --- popups / menus (tmux >= 3.3) ---------------------------------------
set -g popup-border-style   "fg=#504945"
set -g popup-border-lines   rounded
set -g menu-style           "bg=#3c3836,fg=#ebdbb2"
set -g menu-selected-style  "bg=#d79921,fg=#282828"
set -g menu-border-style    "fg=#504945"
